# MinIO/S3 Configuration Example
# Copy this file and modify for your setup

[s3]
# MinIO endpoint (without http/https prefix)
endpoint = 10.16.49.244:9000
; endpoint = 10.16.70.46:9000

# Access credentials
access_key = minioadmin
secret_key = minioadmin
; access_key = admin
; secret_key = yoursecurepassword123

# Bucket name for KV cache storage
bucket = kvcache

# Region (use us-east-1 for MinIO default)
region = us-east-1

# SSL/TLS settings
# Set to true for HTTPS, false for HTTP
use_ssl = false